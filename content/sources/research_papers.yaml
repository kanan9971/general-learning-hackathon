# Source manifest for research papers. Text is extracted locally from `pdf_url`
# (never committed: content/raw and content/processed are gitignored).
# `source_url` is the canonical landing page shown to users in citations.
# Show only short excerpts in the UI and always link out (copyright).
# Papers are difficulty 3 / trust_level 2 so beginners never retrieve them (level+1 cap).
defaults:
  layer: foundation
  content_type: research
  asset_class: equities
  difficulty: 3
  trust_level: 2          # peer-reviewed / institutional working paper
  time_sensitivity: evergreen
  region: US
  market: US equities
